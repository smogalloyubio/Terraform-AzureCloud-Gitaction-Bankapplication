#cloud-config
package_update: true
package_upgrade: true

write_files:
  - path: /var/lib/rancher/k3s/server/token
    permissions: '0600'
    owner: root:root
    content: |
      ${k3s_token}

runcmd:
  - sysctl -w net.ipv4.ip_forward=1
  - echo "net.ipv4.ip_forward=1" >> /etc/sysctl.d/99-kubernetes.conf
  - sysctl --system
  - curl -sfL https://get.k3s.io | K3S_TOKEN="${k3s_token}" sh -s - server --write-kubeconfig-mode 644 --node-ip "${master_private_ip}" --advertise-address "${master_private_ip}" --tls-san "${master_public_ip}"

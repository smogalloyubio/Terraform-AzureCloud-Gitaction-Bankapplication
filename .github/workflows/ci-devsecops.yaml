name: SimpleBank DevSecOps CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci-devsecops.yaml'
      - 'Dockerfile'
      - 'src/**'
      - 'terraform-script/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci-devsecops.yaml'
      - 'Dockerfile'
      - 'src/**'
      - 'terraform-script/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # PARALLEL SCANNING & QUALITY STAGE
  # These jobs run concurrently to maximize pipeline speed
  
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run Gitleaks (Docker)
        run: docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source /path --report-path /path/gitleaks.json --report-format json
      - uses: actions/upload-artifact@v4
        with: { name: simplebank-gitleaks, path: gitleaks.json }

  checkov-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile,kubernetes
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      - uses: actions/upload-artifact@v4
        with: { name: simplebank-checkov, path: checkov.sarif }

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          generateSarif: "1"
      - uses: actions/upload-artifact@v4
        with: { name: semgrep-report, path: semgrep.sarif }

  trivy-k8s-scan:
    name: Trivy K8s Manifest Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-k8s.sarif'
          severity: 'CRITICAL,HIGH'
      - uses: actions/upload-artifact@v4
        with: { name: trivy-k8s-report, path: trivy-k8s.sarif }

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm ci
      - run: npm run lint
        
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm ci
      - run: npm run test

  # DEPENDENCY AUDIT & SAST (Heavy jobs)
  # These depend on lint/tests finishing successfully
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with: { name: simplebank-dependency-audit, path: npm-audit.json }

  codeql-sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

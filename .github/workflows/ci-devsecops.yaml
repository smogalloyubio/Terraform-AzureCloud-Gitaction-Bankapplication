name: SimpleBank DevSecOps CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci-devsecops.yaml'
      - 'Dockerfile'
      - 'src/**'
      - 'terraform-script/**'
      - 'k8s-manifests/**'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:


  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Run Gitleaks (Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            zricethezav/gitleaks:latest detect \
            --source /path \
            --report-path /path/gitleaks.json \
            --report-format json


      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-secret-scan
          path: gitleaks.json




  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (Terraform)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform-script
          framework: terraform
          output_format: sarif
          output_file_path: checkov-terraform.sarif
          soft_fail: true

      - uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform.sarif


  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (Dockerfile)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          output_format: sarif
          output_file_path: checkov-dockerfile.sarif
          soft_fail: true

      - uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile.sarif


  checkov-kubernetes:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (Kubernetes)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./k8s-manifests
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-k8s.sarif
          soft_fail: true

      - uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s.sarif



  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [checkov-kubernetes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }

      - run: npm ci
      - run: npm run lint --if-present

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json


 
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [checkov-kubernetes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }

      - run: npm ci
      - run: npm run test --if-present -- --json --outputFile=unit-test-report.json

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: unit-test-report.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }

      - run: npm audit --json > npm-audit.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: npm-audit.json

  codeql-sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image with Commit Tag
        run: |
          docker build -t simplebank:${{ github.sha }} .
          docker save simplebank:${{ github.sha }} -o simplebank-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: simplebank-image.tar

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Load Image
        run: docker load -i simplebank-image.tar

      - name: Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: simplebank:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-${{ github.sha }}
          path: trivy-image.sarif

  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start App Container
        run: docker run -d -p 3000:3000 simplebank:${{ github.sha }}

      - name: Run ZAP Baseline Scan
        run: docker run --rm owasp/zap2docker-stable zap-baseline.py \
              -t http://localhost:3000 \
              -r zap-report.html

      - uses: actions/upload-artifact@v4
        with:
          name: dast-zap-report-${{ github.sha }}
          path: zap-report.html


  docker-push:
    name: Push Docker Image (Only if all tests pass)
    runs-on: ubuntu-latest
    needs:
      - trivy-image-scan
      - dast-scan
      - dependency-audit
      - codeql-sast
      - checkov-terraform
      - checkov-dockerfile
      - checkov-kubernetes

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load Image
        run: docker load -i simplebank-image.tar

      - name: Push Image
        run: docker push simplebank:${{ github.sha }}
